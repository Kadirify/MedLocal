# Typical adult reference intervals and critical limits, for generating synthetic reports and as
# a fallback when a lab report does not print its own interval. Intervals differ between
# laboratories, methods and populations; the interval printed on a report always wins.
# Not validated for clinical use.
#
# Reference intervals follow the ranges published by Mayo Clinic Laboratories and the
# MedlinePlus test pages. Critical limits follow commonly published hospital call lists.
#
# `aliases`   labels a printed report may use, matched exactly after lower-casing.
# `mentions`  words an English explanation may use for the analyte; `mentions_tr` the Turkish ones.
#             Entries written in capitals are acronyms and are matched case-sensitively, so that
#             "ALT" is never found in the Turkish word "altında".
# `*_context` general, non-diagnostic associations used to ground generated explanations.

panels:
  complete_blood_count:
    - white_blood_cells
    - neutrophils_pct
    - lymphocytes_pct
    - monocytes_pct
    - eosinophils_pct
    - basophils_pct
    - neutrophils_abs
    - lymphocytes_abs
    - monocytes_abs
    - eosinophils_abs
    - basophils_abs
    - red_blood_cells
    - hemoglobin
    - hematocrit
    - mcv
    - mch
    - mchc
    - rdw_cv
    - platelets
    - mpv
    - pdw
  short_blood_count: [white_blood_cells, red_blood_cells, hemoglobin, hematocrit, mcv, platelets]
  kidney: [urea, creatinine, uric_acid]
  basic_metabolic: [glucose_fasting, urea_nitrogen, creatinine, sodium, potassium, calcium]
  electrolytes: [sodium, potassium, chloride, calcium, magnesium, phosphorus]
  liver: [alt, ast, alp, ggt, total_bilirubin, direct_bilirubin, albumin, total_protein]
  liver_short: [alt, ast, ggt]
  lipid: [total_cholesterol, ldl_cholesterol, hdl_cholesterol, triglycerides]
  thyroid: [tsh, free_t4, free_t3]
  thyroid_short: [tsh]
  anemia: [ferritin, iron, tibc, vitamin_b12, folate]
  vitamins: [vitamin_b12, vitamin_d, folate]
  diabetes: [glucose_fasting, hba1c]
  inflammation: [crp, esr]
  muscle: [ck, ldh]

analytes:
  white_blood_cells:
    name: White blood cells
    name_tr: Lökosit (WBC)
    aliases: [wbc, lökosit, lokosit, lökosit sayısı, beyaz küre]
    mentions: [white blood cell, WBC]
    mentions_tr: [lökosit, WBC, akyuvar, beyaz kan hücre]
    unit: 10^3/µL
    decimals: 2
    measures: the number of white blood cells, which help fight infection
    measures_tr: enfeksiyonla savaşan beyaz kan hücrelerinin sayısını
    ranges:
      any: {low: 3.4, high: 9.6}
    critical: {low: 2.0, high: 30.0}
    low_context: can be seen after viral infections or with some medicines
    low_context_tr: viral enfeksiyonlardan sonra veya bazı ilaçlarla görülebilir
    high_context: can be seen with infection, inflammation, physical stress, or smoking
    high_context_tr: enfeksiyon, iltihap, bedensel stres veya sigara kullanımıyla görülebilir

  neutrophils_pct:
    name: Neutrophils (%)
    name_tr: Nötrofil oranı (NEUT%)
    aliases: [neut%, nötrofil oranı, nötrofil %, neu%]
    mentions: [neutrophil]
    mentions_tr: [nötrofil]
    unit: "%"
    decimals: 1
    measures: the share of white blood cells that are neutrophils, the cells that respond first to bacterial infection
    measures_tr: beyaz kan hücreleri içinde, bakteriyel enfeksiyona ilk yanıt veren nötrofillerin payını
    ranges:
      any: {low: 40, high: 74}
    low_context: can be seen after viral infections or with some medicines, and is read together with the absolute count
    low_context_tr: viral enfeksiyonlardan sonra veya bazı ilaçlarla görülebilir; mutlak sayıyla birlikte değerlendirilir
    high_context: can be seen with bacterial infection, inflammation, physical stress, or steroid medicines
    high_context_tr: bakteriyel enfeksiyon, iltihap, bedensel stres veya kortizon türü ilaçlarla görülebilir

  lymphocytes_pct:
    name: Lymphocytes (%)
    name_tr: Lenfosit oranı (LYMPH%)
    aliases: [lymph%, lenfosit oranı, lenfosit %, lym%]
    mentions: [lymphocyte]
    mentions_tr: [lenfosit]
    unit: "%"
    decimals: 1
    measures: the share of white blood cells that are lymphocytes, which handle viruses and immune memory
    measures_tr: beyaz kan hücreleri içinde, virüslerle ve bağışıklık hafızasıyla ilgilenen lenfositlerin payını
    ranges:
      any: {low: 20, high: 45}
    low_context: often just reflects a higher share of neutrophils, and can be seen with stress or steroid medicines
    low_context_tr: çoğu zaman yalnızca nötrofil payının artmasını yansıtır; stres veya kortizon türü ilaçlarla da görülebilir
    high_context: can be seen during and after viral infections
    high_context_tr: viral enfeksiyonlar sırasında ve sonrasında görülebilir

  monocytes_pct:
    name: Monocytes (%)
    name_tr: Monosit oranı (MONO%)
    aliases: [mono%, monosit oranı, monosit %, mon%]
    mentions: [monocyte]
    mentions_tr: [monosit]
    unit: "%"
    decimals: 1
    measures: the share of white blood cells that are monocytes, which clean up damaged tissue and germs
    measures_tr: beyaz kan hücreleri içinde, hasarlı dokuyu ve mikropları temizleyen monositlerin payını
    ranges:
      any: {low: 2, high: 10}
    low_context: a mildly low share on its own is usually not significant
    low_context_tr: tek başına hafif düşük bir oran genellikle anlamlı değildir
    high_context: can be seen while recovering from an infection or with long-lasting inflammation
    high_context_tr: bir enfeksiyondan iyileşme döneminde veya uzun süren iltihapta görülebilir

  eosinophils_pct:
    name: Eosinophils (%)
    name_tr: Eozinofil oranı (EO%)
    aliases: [eo%, eos%, eozinofil oranı, eozinofil %]
    mentions: [eosinophil]
    mentions_tr: [eozinofil]
    unit: "%"
    decimals: 1
    measures: the share of white blood cells that are eosinophils, which take part in allergic reactions
    measures_tr: beyaz kan hücreleri içinde, alerjik tepkilerde rol alan eozinofillerin payını
    ranges:
      any: {low: null, high: 6}
    high_context: can be seen with allergies, asthma, eczema, or some parasitic infections
    high_context_tr: alerji, astım, egzama veya bazı parazit enfeksiyonlarıyla görülebilir

  basophils_pct:
    name: Basophils (%)
    name_tr: Bazofil oranı (BASO%)
    aliases: [baso%, bazofil oranı, bazofil %]
    mentions: [basophil]
    mentions_tr: [bazofil]
    unit: "%"
    decimals: 1
    measures: the share of white blood cells that are basophils, a rare cell type involved in allergic reactions
    measures_tr: beyaz kan hücreleri içinde, alerjik tepkilerde rol alan ve az sayıda bulunan bazofillerin payını
    ranges:
      any: {low: null, high: 1.5}
    high_context: a mildly high share can be seen with allergies and is often not significant on its own
    high_context_tr: hafif yüksek bir oran alerjilerle görülebilir ve tek başına çoğu zaman anlamlı değildir

  neutrophils_abs:
    name: Neutrophil count
    name_tr: Nötrofil sayısı (NEUT#)
    aliases: [neut#, nötrofil sayısı, neu#]
    mentions: [neutrophil]
    mentions_tr: [nötrofil]
    unit: 10^3/µL
    decimals: 2
    measures: the number of neutrophils, the white blood cells that respond first to bacterial infection
    measures_tr: bakteriyel enfeksiyona ilk yanıt veren beyaz kan hücreleri olan nötrofillerin sayısını
    ranges:
      any: {low: 1.8, high: 7.2}
    critical: {low: 0.5, high: null}
    low_context: can be seen after viral infections or with some medicines
    low_context_tr: viral enfeksiyonlardan sonra veya bazı ilaçlarla görülebilir
    high_context: can be seen with bacterial infection, inflammation, physical stress, smoking, or steroid medicines
    high_context_tr: bakteriyel enfeksiyon, iltihap, bedensel stres, sigara veya kortizon türü ilaçlarla görülebilir

  lymphocytes_abs:
    name: Lymphocyte count
    name_tr: Lenfosit sayısı (LYMPH#)
    aliases: [lymph#, lenfosit sayısı, lym#]
    mentions: [lymphocyte]
    mentions_tr: [lenfosit]
    unit: 10^3/µL
    decimals: 2
    measures: the number of lymphocytes, the white blood cells that handle viruses and immune memory
    measures_tr: virüslerle ve bağışıklık hafızasıyla ilgilenen beyaz kan hücreleri olan lenfositlerin sayısını
    ranges:
      any: {low: 1.0, high: 3.4}
    low_context: can be seen with stress, steroid medicines, or after some infections
    low_context_tr: stres, kortizon türü ilaçlar veya bazı enfeksiyonlardan sonra görülebilir
    high_context: can be seen during and after viral infections
    high_context_tr: viral enfeksiyonlar sırasında ve sonrasında görülebilir

  monocytes_abs:
    name: Monocyte count
    name_tr: Monosit sayısı (MONO#)
    aliases: [mono#, monosit sayısı, mon#]
    mentions: [monocyte]
    mentions_tr: [monosit]
    unit: 10^3/µL
    decimals: 2
    measures: the number of monocytes, the white blood cells that clean up damaged tissue and germs
    measures_tr: hasarlı dokuyu ve mikropları temizleyen beyaz kan hücreleri olan monositlerin sayısını
    ranges:
      any: {low: 0.1, high: 0.9}
    low_context: a mildly low count on its own is usually not significant
    low_context_tr: tek başına hafif düşük bir sayı genellikle anlamlı değildir
    high_context: can be seen while recovering from an infection or with long-lasting inflammation
    high_context_tr: bir enfeksiyondan iyileşme döneminde veya uzun süren iltihapta görülebilir

  eosinophils_abs:
    name: Eosinophil count
    name_tr: Eozinofil sayısı (EO#)
    aliases: [eo#, eos#, eozinofil sayısı]
    mentions: [eosinophil]
    mentions_tr: [eozinofil]
    unit: 10^3/µL
    decimals: 2
    measures: the number of eosinophils, the white blood cells that take part in allergic reactions
    measures_tr: alerjik tepkilerde rol alan beyaz kan hücreleri olan eozinofillerin sayısını
    ranges:
      any: {low: null, high: 0.5}
    high_context: can be seen with allergies, asthma, eczema, or some parasitic infections
    high_context_tr: alerji, astım, egzama veya bazı parazit enfeksiyonlarıyla görülebilir

  basophils_abs:
    name: Basophil count
    name_tr: Bazofil sayısı (BASO#)
    aliases: [baso#, bazofil sayısı]
    mentions: [basophil]
    mentions_tr: [bazofil]
    unit: 10^3/µL
    decimals: 2
    measures: the number of basophils, a rare white blood cell involved in allergic reactions
    measures_tr: alerjik tepkilerde rol alan ve az sayıda bulunan bazofillerin sayısını
    ranges:
      any: {low: null, high: 0.2}
    high_context: a mildly high count can be seen with allergies and is often not significant on its own
    high_context_tr: hafif yüksek bir sayı alerjilerle görülebilir ve tek başına çoğu zaman anlamlı değildir

  red_blood_cells:
    name: Red blood cells
    name_tr: Eritrosit (RBC)
    aliases: [rbc, eritrosit, eritrosit sayısı, alyuvar]
    mentions: [red blood cell, RBC]
    mentions_tr: [eritrosit, RBC, alyuvar, kırmızı kan hücre]
    unit: 10^6/µL
    decimals: 2
    measures: the number of red blood cells
    measures_tr: kandaki alyuvar sayısını
    ranges:
      male: {low: 4.35, high: 5.65}
      female: {low: 3.92, high: 5.13}
    low_context: can be seen with anemia, blood loss, or low iron or vitamin levels
    low_context_tr: kansızlık, kan kaybı veya düşük demir ya da vitamin düzeyleriyle görülebilir
    high_context: can be seen with dehydration or smoking
    high_context_tr: sıvı kaybı veya sigara kullanımıyla görülebilir

  hemoglobin:
    name: Hemoglobin
    name_tr: Hemoglobin (HGB)
    aliases: [hgb, hb]
    mentions: [hemoglobin]
    mentions_tr: [hemoglobin]
    unit: g/dL
    decimals: 1
    measures: the protein in red blood cells that carries oxygen around the body
    measures_tr: alyuvarların içinde bulunan ve vücuda oksijen taşıyan proteini
    ranges:
      male: {low: 13.2, high: 16.6}
      female: {low: 11.6, high: 15.0}
    critical: {low: 7.0, high: 20.0}
    low_context: can be seen with low iron, vitamin B12 or folate, blood loss, or long-term health conditions
    low_context_tr: demir, B12 vitamini veya folat eksikliğinde, kan kaybında ya da uzun süreli sağlık sorunlarında görülebilir
    high_context: can be seen with dehydration, smoking, or living at high altitude
    high_context_tr: sıvı kaybı, sigara kullanımı veya yüksek rakımda yaşamayla görülebilir

  hematocrit:
    name: Hematocrit
    name_tr: Hematokrit (HCT)
    aliases: [hct, hematokrit]
    mentions: [hematocrit]
    mentions_tr: [hematokrit]
    unit: "%"
    decimals: 1
    measures: the share of blood volume made up of red blood cells
    measures_tr: kan hacminin ne kadarının alyuvarlardan oluştuğunu
    ranges:
      male: {low: 38.3, high: 48.6}
      female: {low: 35.5, high: 44.9}
    critical: {low: 20.0, high: 60.0}
    low_context: usually moves together with hemoglobin and can be seen with anemia or recent blood loss
    low_context_tr: genellikle hemoglobinle birlikte hareket eder; kansızlıkta veya yakın zamanda kan kaybında görülebilir
    high_context: can be seen with dehydration or smoking
    high_context_tr: sıvı kaybı veya sigara kullanımıyla görülebilir

  mcv:
    name: MCV
    name_tr: MCV (ortalama eritrosit hacmi)
    aliases: [ortalama eritrosit hacmi]
    mentions: [MCV, size of red blood cells, size of your red blood cells]
    mentions_tr: [MCV, ortalama eritrosit hacmi, alyuvarların boyut, alyuvarlarınızın boyut]
    unit: fL
    decimals: 1
    measures: the average size of red blood cells
    measures_tr: alyuvarların ortalama büyüklüğünü
    ranges:
      any: {low: 80, high: 100}
    low_context: smaller red blood cells can be seen with low iron
    low_context_tr: küçük alyuvarlar demir eksikliğinde görülebilir
    high_context: larger red blood cells can be seen with low vitamin B12 or folate, or with regular alcohol use
    high_context_tr: büyük alyuvarlar B12 vitamini veya folat eksikliğinde ya da düzenli alkol kullanımında görülebilir

  mch:
    name: MCH
    name_tr: MCH (ortalama eritrosit hemoglobini)
    aliases: [ortalama eritrosit hemoglobini]
    mentions: [MCH]
    mentions_tr: [MCH]
    unit: pg
    decimals: 1
    measures: the average amount of hemoglobin inside one red blood cell
    measures_tr: tek bir alyuvarın içindeki ortalama hemoglobin miktarını
    ranges:
      any: {low: 27, high: 33}
    low_context: usually goes with smaller red blood cells and can be seen with low iron
    low_context_tr: genellikle küçük alyuvarlarla birlikte görülür ve demir eksikliğinde görülebilir
    high_context: usually goes with larger red blood cells and can be seen with low vitamin B12 or folate
    high_context_tr: genellikle büyük alyuvarlarla birlikte görülür; B12 vitamini veya folat eksikliğinde görülebilir

  mchc:
    name: MCHC
    name_tr: MCHC (ortalama hemoglobin konsantrasyonu)
    aliases: [ortalama hb konsantrasyonu, ortalama eritrosit hemoglobin konsantrasyonu]
    mentions: [MCHC]
    mentions_tr: [MCHC]
    unit: g/dL
    decimals: 1
    measures: how concentrated hemoglobin is inside red blood cells
    measures_tr: alyuvarların içindeki hemoglobinin ne kadar yoğun olduğunu
    ranges:
      any: {low: 32, high: 36}
    low_context: can be seen with low iron
    low_context_tr: demir eksikliğinde görülebilir
    high_context: a mildly high value is often caused by the sample or the measurement and is usually not significant on its own
    high_context_tr: hafif yüksek bir değer çoğu zaman örnekten veya ölçümden kaynaklanır ve tek başına genellikle anlamlı değildir

  rdw_cv:
    name: RDW
    name_tr: RDW (eritrosit dağılım genişliği)
    aliases: [rdw-cv, rdw cv, eritrosit dağılım aralığı, eritrosit dağılım genişliği]
    mentions: [RDW]
    mentions_tr: [RDW]
    unit: "%"
    decimals: 1
    measures: how much red blood cells differ from each other in size
    measures_tr: alyuvarların büyüklüklerinin birbirinden ne kadar farklı olduğunu
    ranges:
      any: {low: 11.5, high: 14.5}
    low_context: a low value is not considered significant
    low_context_tr: düşük bir değer anlamlı kabul edilmez
    high_context: can be seen when red blood cells of different sizes are present, for example with low iron, vitamin B12 or folate
    high_context_tr: farklı boyutlarda alyuvarlar bulunduğunda, örneğin demir, B12 vitamini veya folat eksikliğinde görülebilir

  platelets:
    name: Platelets
    name_tr: Trombosit (PLT)
    aliases: [plt, trombosit, trombosit sayısı]
    mentions: [platelet]
    mentions_tr: [trombosit, PLT, kan pulcuk]
    unit: 10^3/µL
    decimals: 0
    measures: the number of platelets, which help blood to clot
    measures_tr: kanın pıhtılaşmasına yardım eden trombositlerin sayısını
    ranges:
      any: {low: 150, high: 400}
    critical: {low: 20, high: 1000}
    low_context: can be seen after viral infections or with some medicines
    low_context_tr: viral enfeksiyonlardan sonra veya bazı ilaçlarla görülebilir
    high_context: can be seen with inflammation, infection, or low iron
    high_context_tr: iltihap, enfeksiyon veya demir eksikliğiyle görülebilir

  mpv:
    name: MPV
    name_tr: MPV (ortalama trombosit hacmi)
    aliases: [ortalama trombosit hacmi]
    mentions: [MPV]
    mentions_tr: [MPV]
    unit: fL
    decimals: 1
    measures: the average size of platelets
    measures_tr: trombositlerin ortalama büyüklüğünü
    ranges:
      any: {low: 7, high: 12}
    low_context: with a normal platelet count, a mildly low value is usually not significant
    low_context_tr: trombosit sayısı normalken hafif düşük bir değer genellikle anlamlı değildir
    high_context: larger platelets are younger ones; with a normal platelet count this is usually not significant
    high_context_tr: büyük trombositler genç trombositlerdir; trombosit sayısı normalken bu genellikle anlamlı değildir

  pdw:
    name: PDW
    name_tr: PDW (trombosit dağılım genişliği)
    aliases: [trombosit dağılım aralığı, trombosit dağılım genişliği]
    mentions: [PDW]
    mentions_tr: [PDW]
    unit: fL
    decimals: 1
    measures: how much platelets differ from each other in size
    measures_tr: trombositlerin büyüklüklerinin birbirinden ne kadar farklı olduğunu
    ranges:
      any: {low: 9, high: 17}
    low_context: with a normal platelet count, a low value on its own is usually not significant
    low_context_tr: trombosit sayısı normalken tek başına düşük bir değer genellikle anlamlı değildir
    high_context: with a normal platelet count, a high value on its own is usually not significant
    high_context_tr: trombosit sayısı normalken tek başına yüksek bir değer genellikle anlamlı değildir

  glucose_fasting:
    name: Fasting glucose
    name_tr: Açlık glukozu
    aliases: [glucose, glukoz, glukoz (açlık), açlık kan şekeri, açlık glukozu]
    mentions: [glucose]
    mentions_tr: [glukoz, açlık şeker]
    unit: mg/dL
    decimals: 0
    measures: the amount of sugar in the blood after not eating for at least eight hours
    measures_tr: en az sekiz saat açlıktan sonra kandaki şeker miktarını
    ranges:
      any: {low: 70, high: 99}
    critical: {low: 50, high: 450}
    low_context: can be seen after a long time without food or with some diabetes medicines
    low_context_tr: uzun süre aç kalındığında veya bazı diyabet ilaçlarıyla görülebilir
    high_context: can be seen if the sample was not truly fasting, with stress or illness, or with prediabetes or diabetes
    high_context_tr: örnek gerçekten aç karnına alınmadıysa, stres veya hastalık sırasında ya da prediyabet veya diyabette görülebilir

  hba1c:
    name: HbA1c
    name_tr: HbA1c
    aliases: [hemoglobin a1c, glikozile hemoglobin]
    mentions: [HbA1c, A1c]
    mentions_tr: [HbA1c, A1c]
    unit: "%"
    decimals: 1
    measures: the average blood sugar level over roughly the past three months
    measures_tr: yaklaşık son üç aydaki ortalama kan şekeri düzeyini
    ranges:
      any: {low: null, high: 5.6}
    high_context: values from 5.7 to 6.4 are in the range often called prediabetes, and 6.5 or above is in the range used when assessing diabetes
    high_context_tr: 5,7 ile 6,4 arası değerler genellikle prediyabet denen aralıktadır; 6,5 ve üzeri diyabet değerlendirmesinde kullanılan aralıktadır

  urea:
    name: Urea
    name_tr: Üre
    aliases: [üre, ure]
    mentions: [urea]
    mentions_tr: [üre]
    unit: mg/dL
    decimals: 0
    measures: a waste product that the kidneys remove from the blood
    measures_tr: böbreklerin kandan uzaklaştırdığı bir atık maddeyi
    ranges:
      any: {low: 17, high: 43}
    low_context: can be seen with a low-protein diet or drinking a lot of fluid
    low_context_tr: düşük proteinli beslenmede veya çok sıvı alındığında görülebilir
    high_context: can be seen with dehydration, a high-protein diet, or reduced kidney function
    high_context_tr: sıvı kaybında, yüksek proteinli beslenmede veya böbrek işlevi azaldığında görülebilir

  urea_nitrogen:
    name: Blood urea nitrogen
    name_tr: Kan üre azotu (BUN)
    aliases: [bun, kan üre azotu]
    mentions: [urea, BUN]
    mentions_tr: [üre azotu, BUN]
    unit: mg/dL
    decimals: 0
    measures: a waste product that the kidneys remove from the blood
    measures_tr: böbreklerin kandan uzaklaştırdığı bir atık maddeyi
    ranges:
      any: {low: 7, high: 20}
    low_context: can be seen with a low-protein diet or drinking a lot of fluid
    low_context_tr: düşük proteinli beslenmede veya çok sıvı alındığında görülebilir
    high_context: can be seen with dehydration, a high-protein diet, or reduced kidney function
    high_context_tr: sıvı kaybında, yüksek proteinli beslenmede veya böbrek işlevi azaldığında görülebilir

  creatinine:
    name: Creatinine
    name_tr: Kreatinin
