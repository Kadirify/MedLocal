[project]
name = "medlocal-training"
version = "0.1.0"
description = "Fine-tuning, evaluation and export pipeline for MedLocal models"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate>=1.15.0",
    "bitsandbytes>=0.50.2",
    "datasets>=4.3.0",
    "numpy>=2.5.3",
    "peft>=0.21.0",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "torch>=2.8",
    "torchvision>=0.23",
    "transformers>=5.5.0",
    "trl>=0.24.0",
    "unsloth>=2026.9.7",
]

[project.scripts]
medlocal = "medlocal_training.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medlocal_training"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PTH", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]

[[tool.mypy.overrides]]
module = ["torch.*", "datasets.*"]
ignore_missing_imports = true

# transformers ships partial annotations that reject valid processor and generate calls
[[tool.mypy.overrides]]
module = ["transformers", "transformers.*"]
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
